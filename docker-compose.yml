# Local multi-container setup for Locust scaling demos.
# Example:
#   docker compose up --build -d --scale api=1
#   docker compose up --build -d --scale api=3

services:
  api:
    build: .
    environment:
      - TF_CPP_MIN_LOG_LEVEL=2
      - RETRAIN_EPOCHS=2
      - DB_PATH=/app/app_data.db
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./models:/app/models
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  locust:
    image: locustio/locust:2.32.6
    profiles: ["load"]
    volumes:
      - ./locust:/mnt/locust
    ports:
      - "8089:8089"
    command: >
      -f /mnt/locust/locustfile.py
      --host http://nginx
    depends_on:
      - nginx
